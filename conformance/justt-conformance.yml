domain_standards:
  market: card disputes / chargeback representment
  note: >-
    The card-dispute market's standards are card-network programs and reason-code
    schemes rather than IETF/OASIS specifications. Justt's contract carries them as
    enumerations and documented program support, which is the strongest form
    available in this domain.
  entries:
  - id: visa-ce-3.0
    name: Visa Compelling Evidence 3.0
    conforms: true
    kind: card-network-program
    evidence: >-
      https://developers.justt.ai/docs/visa-ce-30-mastercard-fptp-evidence-guide —
      a dedicated integration guide for matching past transaction data against the
      programme's eligibility criteria to contest first-party fraud disputes.
  - id: mastercard-fptp
    name: Mastercard First Party Trust Program
    conforms: true
    kind: card-network-program
    evidence: >-
      Same guide as Visa CE 3.0; Justt documents automated eligibility matching for
      both programmes.
  - id: visa-vamp
    name: Visa Acquirer Monitoring Program
    conforms: true
    kind: card-network-program
    evidence: >-
      VAMP monitoring and compliance tracking is a named product capability
      (https://justt.ai/vamp/).
  - id: visa-dispute-reason-codes
    name: Visa dispute condition / network reason codes
    conforms: true
    kind: code-scheme
    evidence: >-
      network_reason_code appears in the PSP payload shapes Justt accepts; the
      sandbox guide's worked example carries "network_reason_code": "10.4"
      (Visa condition 10.4, "Other Fraud — Card Absent Environment").
  - id: ethoca-verifi-alerts
    name: Ethoca / Verifi CDRN / Verifi RDR pre-chargeback alerts
    conforms: true
    kind: network-alert-scheme
    evidence: >-
      ProviderName enum ["Verifi RDR", "Verifi CDRN", "Ethoca"] and the
      OutcomeStatus enum, which carries the numeric alert outcome codes those
      networks use (100, 101, 102, 130, 900, 901, 902, 940, 950-957, 951) alongside
      their human-readable equivalents, in
      openapi/justt-rest-api-openapi-original.json.
    note: >-
      This is the strongest domain-standard signal in the contract: Justt encodes
      the alert networks' own outcome-code vocabulary directly in its schema, so a
      merchant already reporting Ethoca/Verifi outcomes maps one-to-one with no
      bespoke translation.

