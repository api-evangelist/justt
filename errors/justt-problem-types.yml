async_failure_states:
  note: >-
    Two operations fail asynchronously rather than by HTTP status. Evidence
    submission and chargeback acceptance both return 201 immediately and then move
    through EvidenceSubmissionLifecycle (created | inProgress | failed | succeeded),
    carrying a free-text `error` string on failure (published example: "Network
    timeout"). There is no enumerated failure-code registry for these; poll
    EvidenceController_getEvidenceSubmissionStatus and
    ChargebackItemController_getAcceptChargebackStatus, or subscribe to the
    chargeback.evidence.submitted and chargeback.accepted webhooks, whose payloads
    carry status succeeded | failed.
  webhook_failure_codes:
    event: subscription.cancel_immediately.failed
    fields: [failureCode, failureReason]
    source: https://developers.justt.ai/docs/webhook-events-event-types
    note: >-
      The only event that carries a structured failure code. The code list itself
      is not published.
