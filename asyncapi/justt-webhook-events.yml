events:
- name: chargeback.created
  operationId: chargeback.created
  summary: Triggered when a new chargeback is received for the merchant
  description: >-
    Fires immediately when a new chargeback arrives from any connected PSP. The
    payload carries all chargeback data available at creation.
- name: chargeback.updated
  operationId: chargeback.updated
  summary: Triggered when a chargeback is updated
- name: chargeback.status.updated
  operationId: chargeback.status.updated
  summary: Triggered when a chargeback's PSP status update is received
- name: chargeback.evidence.submitted
  operationId: chargeback.evidence.submitted
  summary: Triggered when evidence is successfully submitted to the PSP
  outcome_field: status (succeeded | failed)
  pairs_with: EvidenceController_submitEvidence
- name: chargeback.accepted
  operationId: chargeback.accepted
  summary: Triggered when a chargeback acceptance is confirmed by the PSP
  outcome_field: status (succeeded | failed)
  pairs_with: ChargebackItemController_acceptChargeback
- name: pre_chargeback_alert.received
  operationId: pre_chargeback_alert.received
  summary: Triggered when a new pre-chargeback alert is received from CDRN, RDR or Ethoca
- name: pre_chargeback_alert.refund.succeeded
  operationId: pre_chargeback_alert.refund.succeeded
  summary: Triggered when the transaction linked to a refunded alert was refunded through the PSP
- name: pre_chargeback_alert.refund.failed
  operationId: pre_chargeback_alert.refund.failed
  summary: Triggered when a refund alert fails to be processed
- name: pre_chargeback_alert.transaction_matched
  operationId: pre_chargeback_alert.transaction_matched
  summary: Triggered when an inbound alert is matched to an underlying transaction
  opt_in: true
  gate: additional_event_types account configuration, set by Justt
- name: subscription.cancel_immediately.success
  operationId: subscription.cancel_immediately.success
  summary: Triggered when a CRM subscription was cancelled successfully after a refund
  integrations: [Chargebee, Recurly]
- name: subscription.cancel_immediately.failed
  operationId: subscription.cancel_immediately.failed
  summary: Triggered when cancelling a CRM subscription failed after a refund
  failure_fields: [failureCode, failureReason]
  note: >-
    The refund succeeded but the cancellation did not; Justt flags the alert as
    Action Required for manual follow-up. The only event carrying a structured
    failure code.
