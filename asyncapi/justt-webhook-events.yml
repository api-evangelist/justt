asyncapi_note: >-
  Justt publishes no AsyncAPI document. It describes its event surface with the
  OpenAPI 3.1 top-level `webhooks` object instead — a legitimate and increasingly
  common choice for HTTP webhooks, and a machine-readable contract either way.
  Eleven events are fully typed with request bodies and schemas. Recorded as a
  Webhooks surface rather than an AsyncAPI one; no AsyncAPI pointer is emitted
  because no AsyncAPI document exists.
