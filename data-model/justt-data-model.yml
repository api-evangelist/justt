identifiers:
  style: UUID and PSP-native strings side by side
  note: >-
    Almost every entity carries TWO ids — Justt's own UUID and the identifier the
    PSP assigned. Conflating them is the most likely integration bug: `id` on a
    chargeback is Justt's UUID, `chargebackId` is the PSP's.
  examples:
  - entity: Chargeback
    justt_id: id (UUID, e.g. 04318fb0-e4ff-4712-972e-4db99b3fb23c)
    psp_id: chargebackId (e.g. QRZ54SXB4K6TF232)
  - entity: Merchant
    justt_id: merchantUuid (format uuid)
    external_id: referenceId (e.g. MERCHANT_001)
  - entity: Integration
    justt_id: integrationId (e.g. 446655440000)
    external_id: externalIdentifier (e.g. INT_001)
  - entity: File
    justt_id: fileId (e.g. file_1234567890)
  - entity: EvidenceSubmission
    justt_id: submitEvidenceId (e.g. sub_1234567890)
