psp_coverage:
  ingest_enum: PSP
  count: 60
  note: >-
    The PSP enum on ingested data names roughly sixty processors (stripe, adyen,
    paypal, braintree, checkout, worldpay variants, chase, nuvei, fiserv, elavon,
    global_payments, square, klarna, paysafe, dlocal, ebanx, payu and more), while
    SupportedPSP — the enum for integrations a merchant can CREATE through the API
    — lists only five (stripe, braintree, paypal, adyen, justt_sandbox). The
    asymmetry is real and worth knowing: Justt ingests from far more processors
    than it lets you self-serve-connect over the API.
notable:
  dispute_optimization: >-
    ChargebackDto exposes DisputeOptimizationResult (Fight | Accept) — Justt's own
    ROI-based recommendation — and a minEnrichmentScore/maxEnrichmentScore filter
    pair on the list endpoint. This is the product's machine-learning output
    surfaced as a first-class, filterable field, and it is the natural input to an
    agent deciding which disputes to escalate to a human.
