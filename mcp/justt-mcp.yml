scope_caveat: >-
  IMPORTANT — this MCP endpoint is served by justt.ai, the WordPress marketing
  site, not by api.justt.ai. It is a genuine, reachable, provider-hosted MCP
  surface on a domain Justt controls, but nothing in Justt's public documentation
