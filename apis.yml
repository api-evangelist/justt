- aid: justt:pre-chargeback-alerts
  name: Justt Pre-Chargeback Alerts API
  description: Justt official REST API for pre-chargeback alerts. Retrieve alerts sourced from Ethoca,
    Verifi CDRN and RDR by search criteria or by id, so a merchant can refund or resolve a transaction
    before it becomes a chargeback.
  humanURL: https://developers.justt.ai/reference/alertcontroller_findall
  baseURL: https://api.justt.ai/v1
  tags:
  - Pre-Chargeback Alerts
  - Prevention
  - Payments
  properties:
  - type: OpenAPI
    url: openapi/justt-pre-chargeback-alerts-openapi-original.json
  - type: Documentation
    url: https://developers.justt.ai/docs/prevention-tools-overview
- aid: justt:webhook-events
  name: Justt Webhook Events
  description: OpenAPI 3.1 specification of the eleven webhook events Justt sends to merchant endpoints
    — chargeback created/updated/status-updated, evidence submitted, chargeback accepted, pre-chargeback
    alert received/refund succeeded/refund failed/transaction matched, and CRM subscription cancellation
    success/failure. Payloads are signed HMAC-SHA256 and delivered with svix signature headers.
  humanURL: https://developers.justt.ai/docs/webhook-introduction
  baseURL: https://api.justt.ai/v1
