aid: justt
name: Justt
description: Justt is an AI-native chargeback management and dispute-representment platform for high-volume
  merchants. Its Dynamic Arguments engine assembles evidence-backed representment packages for card disputes
  across 30+ payment service providers (Stripe, Adyen, PayPal, Braintree, Checkout.com, Worldpay, Chase
  Paymentech, Nuvei and others), and it also handles pre-chargeback alerts from Ethoca, Verifi CDRN and
  RDR. Justt publishes a public developer portal at developers.justt.ai with three OpenAPI definitions
  — a REST API for chargebacks, transactions, evidence, files, merchants and integrations; a Pre-Chargeback
  Alerts API; and an OpenAPI 3.1 webhook-events specification covering eleven signed event types — plus
  an RFC 9727 /.well-known/api-catalog, an llms.txt documentation index, a sandbox environment, and a
  Vanta-hosted trust center.
