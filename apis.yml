apis:
- aid: justt:rest-api
  name: Justt REST API
  description: The Justt REST API lets merchants read and manage chargebacks, enrich them with transaction
    data and evidence files, decide whether Justt should fight or accept a dispute, manage merchants and
    PSP integrations, record pre-chargeback alert outcomes, and request data-subject removal. Bearer API-key
    authentication over HTTPS; JSON request and response bodies.
  humanURL: https://developers.justt.ai/reference
  baseURL: https://api.justt.ai/v1
  image: https://justt.ai/wp-content/uploads/2025/03/blog-7-1.jpg
